# /etc/nginx/sites-available/safesol
# Then: sudo ln -s /etc/nginx/sites-available/safesol /etc/nginx/sites-enabled/

# Route planning and storm escape run Dijkstra, so limit how often one visitor can call the API.
limit_req_zone $binary_remote_addr zone=safesol_api:10m rate=5r/s;

server {
    listen 80;
    server_name safesol.example.com;   # set to your domain, e.g. cosmic84.tahmid-hasan-rafi.com

    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        limit_req zone=safesol_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}